  <!-- Canvas Background: Fully Transparent (No background rect) -->

  <!-- ==================== HEADER ==================== -->
  <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="800" class="title-text" letter-spacing="-0.3">lake-research-map: Medallion Architecture &amp; Analytical Pipeline</text>
