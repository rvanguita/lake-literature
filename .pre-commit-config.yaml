repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: block-docs-on-main
        name: Bloqueia commit de documentação direto na main
        entry: scripts/git-hooks/check-docs-branch.sh
        language: script
        pass_filenames: false
        always_run: true
