[project]
name = "lake-literature"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rene", email = "renevajr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bibtexparser>=2.0.1",
    "fastembed>=0.8.0",
    "networkx>=3.6.1",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pymysql>=1.2.0",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.53",
    "streamlit>=1.63.0",
]

[project.scripts]
lake-literature = "lake_literature:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
